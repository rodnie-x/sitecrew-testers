name: SiteCrew device kill leg (emulator)

on:
  workflow_dispatch:
    inputs:
      cycles:
        description: "kill/relaunch cycles"
        default: "20"

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config zip unzip ccache libltdl-dev patch

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform + NDK
        run: |
          sdkmanager --install "platforms;android-33" "build-tools;34.0.0" "platform-tools" > /dev/null
          yes | sdkmanager --licenses > /dev/null || true
          cd "$ANDROID_HOME"
          for V in r25b r25c r26b; do
            if wget -q --spider "https://dl.google.com/android/repository/android-ndk-$V-linux.zip"; then
              echo "Downloading NDK $V"
              wget -q "https://dl.google.com/android/repository/android-ndk-$V-linux.zip"
              unzip -q "android-ndk-$V-linux.zip"
              break
            fi
          done
          NDKDIR=$(ls -d "$ANDROID_HOME"/android-ndk-* 2>/dev/null | head -n 1)
          if [ -z "$NDKDIR" ]; then echo "No NDK downloaded!"; exit 1; fi
          echo "ANDROIDNDK=$NDKDIR" >> "$GITHUB_ENV"

      - name: Install python-for-android (stable release)
        run: |
          pip install -U pip wheel
          pip install "cython<3"
          pip install "python-for-android==2024.1.21"

      - name: Disable hardware acceleration (MediaTek WebView crash workaround)
        run: |
          P4A_DIR=$(python -c "import pythonforandroid, os; print(os.path.dirname(pythonforandroid.__file__))")
          T="$P4A_DIR/bootstraps/webview/build/templates/AndroidManifest.tmpl.xml"
          sed -i 's/android:hardwareAccelerated="true"/android:hardwareAccelerated="false"/' "$T"

      - name: Build APK (x86_64 for the emulator, webview bootstrap)
        run: |
          p4a apk \
            --bootstrap=webview \
            --dist_name=sitecrew \
            --name="SiteCrew AI" \
            --version=0.1 \
            --package=com.sitecrew.ai \
            --minsdk=24 \
            --ndk-api=24 \
            --android-api=33 \
            --arch=x86_64 \
            --port=8080 \
            --private=app \
            --requirements=python3,android,pyjnius,requests,python-dotenv \
            --permission=POST_NOTIFICATIONS \
            --permission=READ_CONTACTS \
            --permission=SEND_SMS \
            --permission=READ_SMS \
            --permission=CALL_PHONE \
            --permission=CAMERA \
            --permission=ACCESS_FINE_LOCATION \
            --permission=ACCESS_COARSE_LOCATION \
            --permission=READ_EXTERNAL_STORAGE \
            --wakelock \
            --allow-backup=false \
            --storage-dir="$GITHUB_WORKSPACE/.p4a-storage"

      - name: Show APK
        run: ls -la *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sitecrew-x86_64-apk
          path: ./*.apk
          if-no-files-found: error

  kill-leg:
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v4
        with:
          name: sitecrew-x86_64-apk
          path: apk-build/

      - name: Run device kill leg on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -e
            adb wait-for-device
            APK=$(ls apk-build/*.apk)
            adb install -r -t "$APK"
            adb root
            sleep 2
            # boot the app once so p4a unpacks the payload, then enable the store flag
            adb shell am start -n com.sitecrew.ai/org.kivy.android.PythonActivity || true
            sleep 25
            adb shell "echo 1 > /data/data/com.sitecrew.ai/files/app/SITECREW_STORE"
            adb shell am force-stop com.sitecrew.ai
            adb forward tcp:18110 tcp:8080
            export SC_ADB=adb
            export SC_CYCLES=${{ inputs.cycles }}
            python tests/device_kill_leg.py

      - name: Print kill-leg summary
        if: always()
        run: |
          if [ -f tests/evidence/p12_device_report.json ]; then
            cat tests/evidence/p12_device_report.json
          else
            echo "no evidence file produced"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kill-leg-evidence
          path: tests/evidence/
          if-no-files-found: warn
